# Keeps the free Supabase project awake. Supabase pauses a free project after about a week
# with no activity; this asks the database one public question (is a username taken?) every
# three days. A failed run means the project is paused or down: restore it from the Supabase
# dashboard (free), then re-run this workflow.
# GitHub turns scheduled workflows off after 60 days without a commit; it emails first, and
# one click in the Actions tab turns it back on.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: apps/web/.env
          sparse-checkout-cone-mode: false
      - name: Ask the database a question
        run: |
          set -eu
          url=$(sed -n 's/^NEXT_PUBLIC_SUPABASE_URL=//p' apps/web/.env)
          key=$(sed -n 's/^NEXT_PUBLIC_SUPABASE_KEY=//p' apps/web/.env)
          answer=$(curl -sS --fail-with-body --max-time 60 -X POST "$url/rest/v1/rpc/username_problem" \
            -H "apikey: $key" -H "Content-Type: application/json" -d '{"name":"keepalive"}')
          echo "Database answered: $answer"
